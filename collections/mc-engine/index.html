<!DOCTYPE html>
<html lang="en">
<head>
<title>MC Engine V2</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="shortcut icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="manifest" href="assets/site.webmanifest">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="McEngine.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script defer src="../../pwa.js"></script>
</head>
<body>
  <main class="app-shell">
    <section id="passwordDialog" class="container auth-screen">
      <article class="auth-card">
        <p class="eyebrow">MC Engine</p>
        <h1>Unlock your practice question bank</h1>
        <p class="intro-copy">Enter the passcode to load the practice topics and start your review session.</p>
        <label class="field-label" for="passwordInput">Please enter the password to load MC Engine:</label>
        <input type="password" id="passwordInput" placeholder="Enter passcode" />
        <div class="control-bar auth-actions">
          <button id="submitPassword" class="btn btn-success">Submit</button>
          <div id="errorMessage" class="error-message">Incorrect password, please try again.</div>
        </div>
      </article>
    </section>

    <section id="mcEngineContainer" class="container app-frame" aria-label="MC Engine practice panel">
      <div class="top-controls-layout">
        <header id="appHeader" class="app-header">
          <div class="header-left">
            <p class="eyebrow">MC Engine</p>
            <label class="topic-label" for="topicOptions">Question bank</label>
            <div class="topic-control-row">
              <select id="topicOptions" aria-label="Choose a question bank"></select>
              <button
                id="randomOptionsBtn"
                class="icon-toggle-btn"
                type="button"
                aria-label="Randomize answer choices"
                aria-pressed="false"
                title="Randomize answer choices"
              >
                <svg aria-hidden="true" viewBox="0 0 24 24" class="icon-toggle-svg">
                  <path d="M16 3h5v5"></path>
                  <path d="M4 20 21 3"></path>
                  <path d="M21 16v5h-5"></path>
                  <path d="M15 15l6 6"></path>
                  <path d="M4 4l5 5"></path>
                </svg>
              </button>
            </div>
          </div>
          <div id="totalQuestions" class="header-right"></div>
        </header>

        <div id="navigationContainer" class="control-bar action-bar">
          <div class="button-row action-group right-aligned">
            <div class="button-row-group">
              <button id="previousBtn" class="btn btn-success">Previous</button>
              <button id="nextBtn" class="btn btn-success">Next</button>
            </div>
            <div class="button-row-group">
              <button id="resetBtn" class="btn btn-dark">Reset</button>
              <button id="submitBtn" class="btn btn-primary">Submit</button>
            </div>
          </div>
        </div>
      </div>

      <div class="dashboard-grid">
        <article id="questionContainer" class="panel question-card">
          <div class="panel-label">Question</div>
          <div class="question-title-row">
            <div id="questionIndex" class="question-index"></div>
            <button
              id="copyQuestionBtn"
              class="copy-question-btn"
              type="button"
              aria-label="Copy question and answers"
              title="Copy question and answers"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" class="copy-question-svg">
                <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
          <div id="questionText" class="question-text"></div>
        </article>

        <aside id="answerContainer" class="panel answer-card">
          <div class="panel-label">Answer choices</div>
          <form id="answersForm">
            <!-- Options will be populated here -->
          </form>
        </aside>
      </div>

    </section>

    <section id="jumpDialog" class="jump-dialog" aria-hidden="true">
      <div class="jump-dialog-card">
        <div class="jump-dialog-header">
          <h3>Jump to question</h3>
          <button id="closeJumpDialog" class="btn btn-link jump-close" type="button" aria-label="Close">×</button>
        </div>
        <p class="jump-dialog-copy">Choose a starting question block:</p>
        <div id="jumpOptions" class="jump-options"></div>
      </div>
    </section>
  </main>
  <script src="McEngine.js"></script>
</body>
</html>
